<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>归爪 · 组件规整验收板</title><link rel="stylesheet" href="../code/visual-lock.roles.css"><style>
:root{color-scheme:only dark}*{box-sizing:border-box}body{margin:0;background:#35312a}button,textarea{font-family:inherit;cursor:pointer}h1,h2,p{margin:0}.board{max-width:390px;padding:24px 20px 32px;margin:20px auto;background:var(--gz-bg);border-radius:24px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--gz-muted)}h1{font-size:23px;margin:6px 0 8px}.note{font-size:12px;color:var(--gz-secondary);line-height:1.7}.spec{margin-top:24px}.spec h2{font-size:14px;font-weight:500;color:#c1c9b2;margin:0 0 10px}.spec-title{font-size:21px;font-weight:600;margin:0 0 16px}.caption{font-size:11px;color:var(--gz-muted);margin-top:8px}textarea{resize:vertical}.demo-status{font-size:12px;line-height:20px;margin-top:16px;color:#bdc8ab}@media(max-width:430px){.board{margin:0 auto;border-radius:0}}
</style></head><body><main class="board gz-visual-lock"><p class="eyebrow">GUIZHUA · COMPONENT CONTRACT</p><h1>规整到每一种操作。</h1><p class="note">同职责同尺寸，不同职责有层级。可点击选择，仅为样式验收；不保存业务数据。</p>
<section class="spec"><h2>01 / 主次动作 · 高 48 · 圆角 14</h2><div class="gz-panel"><p class="spec-title">把今天，留在这里。</p><div class="gz-actions"><button type="button" class="gz-btn gz-btn--primary"><svg class="gz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M13 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M13 10l7-7 2 2-7 7-4 1z"/></svg><span class="gz-label">记录今天</span></button><button type="button" class="gz-btn"><svg class="gz-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 11.5a8.5 8.5 0 0 1-9 8.5H4l-2 2V12a9 9 0 0 1 19-.5Z"/></svg><span class="gz-label">AI 问诊</span></button></div></div></section>
<section class="spec"><h2>02 / 分段选择 · 外框 44 · 选中面 36</h2><div class="gz-segmented" role="tablist"><button type="button" class="gz-segment-hit is-selected" role="tab" aria-selected="true"><span class="gz-segment-face">健康与观察</span></button><button type="button" class="gz-segment-hit" role="tab" aria-selected="false"><span class="gz-segment-face">日常与照片</span></button></div></section>
<section class="spec"><h2>03 / 既有十二事件 · 三列等宽</h2><div class="gz-event-grid"><button type="button" class="gz-choice-hit" aria-pressed="false"><span class="gz-choice-face">饮食</span></button><button type="button" class="gz-choice-hit" aria-pressed="false"><span class="gz-choice-face">饮水</span></button><button type="button" class="gz-choice-hit" aria-pressed="false"><span class="gz-choice-face">精神</span></button><button type="button" class="gz-choice-hit" aria-pressed="false"><span class="gz-choice-face">便便</span></button><button type="button" class="gz-choice-hit" aria-pressed="false"><span class="gz-choice-face">体重</span></button><button type="button" class="gz-choice-hit" aria-pressed="false"><span class="gz-choice-face">睡眠</span></button><button type="button" class="gz-choice-hit" aria-pressed="false"><span class="gz-choice-face">外出 / 运动</span></button><button type="button" class="gz-choice-hit" aria-pressed="false"><span class="gz-choice-face">洗澡 / 清洁</span></button><button type="button" class="gz-choice-hit" aria-pressed="false"><span class="gz-choice-face">疫苗 / 驱虫</span></button><button type="button" class="gz-choice-hit" aria-pressed="false"><span class="gz-choice-face">用药</span></button><button type="button" class="gz-choice-hit" aria-pressed="false"><span class="gz-choice-face">异常情况</span></button><button type="button" class="gz-choice-hit" aria-pressed="false"><span class="gz-choice-face">小事 / 备注</span></button></div><p class="caption">触控区 44，标签面 38，文字垂直居中；不再长成椭圆。</p></section>
<section class="spec"><h2>04 / 保存动作 · 与首页同高同圆角</h2><textarea class="gz-field" aria-label="虚构观察输入" placeholder="记录你观察到的情况……"></textarea><button type="button" class="gz-btn gz-btn--primary gz-btn--wide" style="margin-top:12px">保存日常记录</button></section>
<section class="spec"><h2>05 / 周历 · 七列等宽 · 高 74</h2><div class="gz-week"><button type="button" class="gz-day"><span class="gz-day-small">周一</span><span class="gz-day-number">28</span><span class="gz-day-small">十八</span></button><button type="button" class="gz-day is-selected"><span class="gz-day-small">周二</span><span class="gz-day-number">29</span><span class="gz-day-small">十九</span></button><button type="button" class="gz-day"><span class="gz-day-small">周三</span><span class="gz-day-number">30</span><span class="gz-day-small">二十</span></button><button type="button" class="gz-day"><span class="gz-day-small">周四</span><span class="gz-day-number">1</span><span class="gz-day-small">国庆</span></button><button type="button" class="gz-day"><span class="gz-day-small">周五</span><span class="gz-day-number">2</span><span class="gz-day-small">廿二</span></button><button type="button" class="gz-day"><span class="gz-day-small">周六</span><span class="gz-day-number">3</span><span class="gz-day-small">廿三</span></button><button type="button" class="gz-day"><span class="gz-day-small">周日</span><span class="gz-day-number">4</span><span class="gz-day-small">廿四</span></button></div></section>
<section class="spec"><h2>06 / 账号与安全 · 是设置行，不是主按钮</h2><div class="gz-group" style="padding:0"><button type="button" class="gz-settings-row"><span class="gz-row-copy">账号与安全<span class="gz-row-sub">登录设备与账号设置</span></span><svg class="gz-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m9 5 7 7-7 7"/></svg></button><button type="button" class="gz-settings-row" style="border-bottom:0"><span class="gz-row-copy">宠物档案与展示设置</span><svg class="gz-row-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m9 5 7 7-7 7"/></svg></button></div></section><p class="demo-status" id="status">参考代码已固定尺寸；正式功能继续接原项目。</p></main><script>
document.querySelectorAll('.gz-choice-hit').forEach(b=>b.onclick=()=>{const v=!b.classList.contains('is-selected');b.classList.toggle('is-selected',v);b.setAttribute('aria-pressed',String(v));document.querySelector('#status').textContent='样式选择：'+b.textContent+(v?'已选':'已取消')});
document.querySelectorAll('.gz-segment-hit').forEach(b=>b.onclick=()=>{document.querySelectorAll('.gz-segment-hit').forEach(x=>{x.classList.toggle('is-selected',x===b);x.setAttribute('aria-selected',String(x===b))})});
document.querySelectorAll('.gz-day').forEach(b=>b.onclick=()=>{document.querySelectorAll('.gz-day').forEach(x=>x.classList.toggle('is-selected',x===b))});
</script></body></html>
